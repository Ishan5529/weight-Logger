<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Logger</title>
    <link rel="stylesheet" href="styles.css">
    <script type="text/javascript" src="https://cdn.canvasjs.com/canvasjs.min.js"></script>
</head>

<body>
    <div class="container">
        <h1 id="heading">Weight Logger</h1>
        <div class="addLog">
            <input type="date" id="date">
            <input type="number" id="weightKg"  oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);" maxlength="3" max="500" min="10">
            <p>kg</p>
            <input type="number" id="weightG"  oninput="javascript: if (this.value.length > this.maxLength) this.value = this.value.slice(0, this.maxLength);" maxlength="3" max="999" min="000">
            <p>g</p>
            <button id="submit">ADD LOG</button>
        </div>
        <h2 id="heading2">Visualize Your Journey</h2>
        <div id="myChart"></div>
        <div class="weightLog">
            <button id="clearLast">Delete Last</button>
            <button id="clear">CLEAR</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
